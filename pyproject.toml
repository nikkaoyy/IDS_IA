[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ids-ieee802-3"
version = "0.1.0"
description = "Prototipo de IDS basado en IA con huella digital IEEE 802.3"
readme = "README.md"
authors = [
    { name = "Nicolás Martínez Pineda" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "scapy>=2.5",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "matplotlib>=3.7",
    "statsmodels>=0.14",
]
# Para ejecutar notebooks/cierre_e7.ipynb con `jupyter nbconvert --execute`.
notebook = [
    "nbconvert>=7.0",
    "nbformat>=5.9",
    "ipykernel>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
